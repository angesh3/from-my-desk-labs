services:
  from-my-desk:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      WEBSITE_TEMPLATE_DIR: /srv/website/app/templates
      WEBSITE_STATIC_DIR: /srv/website/app/static
      LAB_STATIC_DIR: /srv/labs/001-know-your-agent/static
      LAB002_STATIC_DIR: /srv/labs/002-delegated-authority/static
      CATALOG_PATH: /srv/website/catalog/labs.yaml
      POLICY_DIR: /srv/labs/001-know-your-agent/policies
      LAB002_DATA_DIR: /srv/labs/002-delegated-authority/examples
      LAB002_POLICY_DIR: /srv/labs/002-delegated-authority/policies
      LAB003_STATIC_DIR: /srv/labs/003-agent-access-control/static
      LAB003_DATA_DIR: /srv/labs/003-agent-access-control/examples
      LAB003_POLICY_DIR: /srv/labs/003-agent-access-control/policies
      LAB004_STATIC_DIR: /srv/labs/004-agent-escalation-boundary/static
      LAB004_DATA_DIR: /srv/labs/004-agent-escalation-boundary/examples
      LAB004_POLICY_DIR: /srv/labs/004-agent-escalation-boundary/policies
      LAB005_STATIC_DIR: /srv/labs/005-verifiable-action-receipts/static
      LAB005_DATA_DIR: /srv/labs/005-verifiable-action-receipts/examples
      LAB005_POLICY_DIR: /srv/labs/005-verifiable-action-receipts/policies
      PORT: "8080"
      POSTHOG_ENABLED: "false"
      POSTHOG_KEY: ""
      POSTHOG_HOST: https://us.i.posthog.com
      REGISTRY_PUBLIC: sanitized
      APP_VERSION: "0.4.0"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
