  - id: "002"
    edition_number: 2
    slug: delegated-authority
    title: "KYA: Delegated Authority — Trust Must Narrow at Every Handoff"
    subtitle: "When authority moves from a human to an agent, sub-agent, and tool, each handoff must narrow — never expand — what may be done."
    summary: "Lab 002 demonstrates delegated authority, parent-child constraints, APE profiling, APSE posture, revocation propagation, and restricted fallback. Policy evaluation never executes a tool action."
    status: published
    tags:
      - AI Agents
      - Delegated Authority
      - Digital Trust
      - Know Your Agent
    lab_url: /labs/delegated-authority
    newsletter_url: https://www.linkedin.com/newsletters/from-my-desk-7492634647890341890/
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "Educational simulation with fictional principals, agents, delegations, and posture evidence. No real accounts, credentials, or transactions. Execution is never performed."
    reader_title: "Delegated Authority"
    homepage_earlier_description: "What happens when an agent passes part of its authority to another agent? Follow the chain and see why authority may stay within the same boundary or become narrower at each handoff, but must never expand."

  - id: "003"
    edition_number: 3
    slug: agent-access-control
    title: "Agent Access Control"
    subtitle: "When agents act on behalf of principals, every request needs live authority evaluation — not just a one-time network gate."
    summary: "Walk through live authority evaluation for agent requests — registration, delegation, posture, and context checked per request, with canonical events and restricted recovery. Policy evaluation never executes a tool action."
    status: published
    tags:
      - AI Agents
      - Access Control
      - Digital Trust
      - Know Your Agent
    lab_url: /labs/agent-access-control
    newsletter_url: https://www.linkedin.com/newsletters/from-my-desk-7492634647890341890/
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "Educational simulation with fictional Cedar Quill Markets principals, agents, delegations, and posture evidence. No real accounts, credentials, or transactions. Execution is never performed."
    homepage_lead: "What changes when an agent does more than connect to a system and begins acting through tools, data and delegated authority?"
    homepage_detail: "Follow a request as identity, intent, authority, posture and context are evaluated. Try managed, unknown and noncompliant agent scenarios, then see why the result becomes ALLOW, CONFIRM, STEP_UP or DENY."
    homepage_safety: "The scenarios are fictional, and the Lab never performs the protected action."
