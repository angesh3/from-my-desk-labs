labs:
  - id: "001"
    edition_number: 1
    slug: know-your-agent
    title: "Know Your Agent: Identity Is Only the Beginning"
    subtitle: "Identity can establish which agent is acting. Authority, scope, limits, and context determine whether its requested action should proceed."
    summary: "Identity can establish which agent is acting. Authority, scope, limits, and context determine whether its requested action should proceed."
    status: published
    tags:
      - AI Agents
      - Identity
      - Authorization
      - Digital Trust
    lab_url: /labs/know-your-agent
    newsletter_url: https://www.linkedin.com/newsletters/from-my-desk-7492634647890341890/
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "Educational simulation with fictional companies, agents, accounts, tickers, and thresholds. Not investment advice. No order is executed."
    reader_title: "Know Your Agent"
    homepage_earlier_description: "Identity tells us which agent is acting. The first Lab explores why authority, limits and context still have to be evaluated before an action proceeds."

  - id: "002"
    edition_number: 2
    slug: delegated-authority
    title: "KYA: Delegated Authority — Trust Must Narrow at Every Handoff"
    subtitle: "When authority moves from a human to an agent, sub-agent, and tool, each handoff must narrow — never expand — what may be done."
    summary: "Lab 002 demonstrates delegated authority, parent-child constraints, APE profiling, APSE posture, revocation propagation, and restricted fallback. Policy evaluation never executes a tool action."
    status: published
    tags:
      - AI Agents
      - Delegated Authority
      - Digital Trust
      - Know Your Agent
    lab_url: /labs/delegated-authority
    newsletter_url: https://www.linkedin.com/newsletters/from-my-desk-7492634647890341890/
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "Educational simulation with fictional principals, agents, delegations, and posture evidence. No real accounts, credentials, or transactions. Execution is never performed."
    reader_title: "Delegated Authority"
    homepage_earlier_description: "What happens when an agent passes part of its authority to another agent? Follow the chain and see why authority may stay within the same boundary or become narrower at each handoff, but must never expand."

  - id: "003"
    edition_number: 3
    slug: agent-access-control
    title: "Agent Access Control"
    subtitle: "When agents act on behalf of principals, every request needs live authority evaluation — not just a one-time network gate."
    summary: "Walk through live authority evaluation for agent requests — registration, delegation, posture, and context checked per request, with canonical events and restricted recovery. Policy evaluation never executes a tool action."
    status: published
    tags:
      - AI Agents
      - Access Control
      - Digital Trust
      - Know Your Agent
    lab_url: /labs/agent-access-control
    newsletter_url: https://www.linkedin.com/newsletters/from-my-desk-7492634647890341890/
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "Educational simulation with fictional Cedar Quill Markets principals, agents, delegations, and posture evidence. No real accounts, credentials, or transactions. Execution is never performed."
    reader_title: "Agent Access Control"
    homepage_earlier_description: "What changes when an agent does more than connect and begins acting through tools, data and delegated authority?"
    homepage_lead: "What changes when an agent does more than connect to a system and begins acting through tools, data and delegated authority?"
    homepage_detail: "Follow a request as identity, intent, authority, posture and context are evaluated. Try managed, unknown and noncompliant agent scenarios, then see why the result becomes ALLOW, CONFIRM, STEP_UP or DENY."
    homepage_safety: "The scenarios are fictional, and the Lab never performs the protected action."

  - id: "004"
    edition_number: 4
    slug: agent-escalation-boundary
    title: "The Agent Escalation Boundary"
    subtitle: "Authorization tells an agent what it may do. Judgment determines when it should not continue alone."
    summary: "Explore when an authorized agent should proceed, clarify, escalate or stop as uncertainty and potential impact change."
    status: published
    tags:
      - Agent Governance
      - Agent Authority
      - Human Oversight
      - Security
      - Escalation
      - Responsible AI
    lab_url: /labs/agent-escalation-boundary
    newsletter_url: "[EDITION_4_NEWSLETTER_URL]"
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "This Lab is an educational policy prototype using fictional data. It does not make real security decisions and should not be used as a production authorization or incident-response system. Execution is never performed."
    reader_title: "The Agent Escalation Boundary"
    homepage_lead: "An agent can be authorized to act and still need to pause. When should it proceed, clarify, escalate, or stop?"
    homepage_detail: "Adjust evidence, impact, reversibility and time sensitivity for a fictional security-operations case, then see why the execution judgment changes."
    homepage_safety: "The scenarios are fictional, and the Lab never performs a real security action."
    homepage_earlier_description: "A trustworthy agent is not one that always finishes the task. It recognizes when continuing alone would be unsafe."

  - id: "005"
    edition_number: 5
    slug: verifiable-action-receipts
    title: "Can We Prove What the Agent Actually Did?"
    subtitle: "Trustworthy autonomy needs more than an activity log. It needs a verifiable record of request, authority, judgment, execution, and outcome."
    summary: "Build and verify fictional action receipts that connect identity, delegated authority, policy decisions, human involvement, simulated tool activity, and integrity checks."
    status: published
    tags:
      - Agent Governance
      - Auditability
      - Accountability
      - Security
      - Evidence
      - Responsible AI
    lab_url: /labs/verifiable-action-receipts
    newsletter_url: "[EDITION_5_NEWSLETTER_URL]"
    github_url: https://github.com/angesh3/from-my-desk-labs
    interactive: true
    featured: false
    disclaimer: "This Lab is an educational receipt prototype using fictional data. It does not create production audit evidence, digitally sign production events, or perform security actions. Execution is never performed against real systems."
    reader_title: "Verifiable Action Receipts"
    homepage_lead: "An agent’s claim that it finished a task is not enough. Can we prove what it actually did—and why?"
    homepage_detail: "Generate hash-protected fictional receipts for Cedar Quill Markets cases, then verify integrity, tampering, and broken receipt chains."
    homepage_safety: "The scenarios are fictional, and the Lab never performs a real security action."
    homepage_earlier_description: "A useful receipt binds intent, authority, judgment, execution, and outcome—not only an activity line."
