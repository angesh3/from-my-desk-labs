<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Lab 002 restricted fallback</title>
  <desc id="desc">
    Original decision such as DENY remains immutable. Fallback offers permitted recovery operations,
    prohibits execute and override deny, requires a new evaluation, and never converts the original DENY into permission.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0b1f33"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#c4a35a"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="#f7f4ec"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="20" fill="#0b1f33">Restricted fallback</text>
  <text x="32" y="64" font-family="Georgia, serif" font-size="13" fill="#5c5a54">New path; original decision immutable</text>

  <g font-family="Georgia, serif" font-size="13" fill="#0b1f33">
    <rect x="60" y="100" width="280" height="72" fill="#ffffff" stroke="#a31f1f" stroke-width="2"/>
    <text x="200" y="130" text-anchor="middle">Original decision</text>
    <text x="200" y="152" text-anchor="middle" fill="#a31f1f">DENY (immutable)</text>

    <path d="M340 136 H400" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>
    <rect x="400" y="100" width="220" height="72" fill="#ffffff" stroke="#0b1f33"/>
    <text x="510" y="130" text-anchor="middle">Reason code</text>
    <text x="510" y="152" text-anchor="middle" font-size="11" fill="#5c5a54">e.g. capability_not_delegated</text>

    <path d="M620 136 H680" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>
    <rect x="680" y="100" width="220" height="72" fill="#0b1f33"/>
    <text x="790" y="142" text-anchor="middle" fill="#f7f4ec">Fallback recommend</text>

    <path d="M790 172 V210" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="60" y="220" width="280" height="88" fill="#f7f4ec" stroke="#1f7a4d" stroke-width="2"/>
    <text x="200" y="252" text-anchor="middle">Permitted</text>
    <text x="200" y="274" text-anchor="middle" font-size="12">new delegation / review</text>
    <text x="200" y="292" text-anchor="middle" font-size="12">refresh / register</text>

    <rect x="360" y="220" width="280" height="88" fill="#f7f4ec" stroke="#a31f1f" stroke-width="2"/>
    <text x="500" y="252" text-anchor="middle">Prohibited</text>
    <text x="500" y="274" text-anchor="middle" font-size="12">execute_action</text>
    <text x="500" y="292" text-anchor="middle" font-size="12">override_deny</text>

    <rect x="660" y="220" width="240" height="88" fill="#f7f4ec" stroke="#c4a35a" stroke-width="2"/>
    <text x="780" y="260" text-anchor="middle">new_evaluation</text>
    <text x="780" y="280" text-anchor="middle" font-size="12">required: true</text>

    <path d="M200 308 V348" stroke="#c4a35a" fill="none" marker-end="url(#arrow-gold)"/>
    <path d="M780 308 V348" stroke="#c4a35a" fill="none" marker-end="url(#arrow-gold)"/>

    <rect x="60" y="352" width="840" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="480" y="376" text-anchor="middle">Recovery ops ' fresh POST /api/labs/002/evaluate</text>
    <text x="480" y="396" text-anchor="middle" font-size="12" fill="#5c5a54">Produces a new decision / original audit unchanged</text>

    <rect x="120" y="440" width="720" height="64" fill="#0b1f33"/>
    <text x="480" y="468" text-anchor="middle" fill="#f7f4ec" font-size="14">Fallback may create a new recovery path.</text>
    <text x="480" y="490" text-anchor="middle" fill="#c4a35a" font-size="14">It never converts the original DENY into permission.</text>
  </g>
</svg>
