scenarios:
  - id: valid_narrow_delegation
    title: Valid narrow delegation
    short_description: Research-only request within effective authority.
    category: valid_recoverable
    expected_decision: allow
    expected_reason_code: policy_satisfied
    request:
      request_id: req-valid-001
      principal_id: principal-demo-001
      agent_id: research-agent-001
      requested_capability: research
      requested_resource: market-summaries
      requested_amount: "500.00"
      request_time: "2026-03-15T14:00:00Z"
      delegation_id: del-portfolio-research
      context: normal
      assurance_level: standard
    chain_preview:
      - {role: Human Principal, capabilities: [research, propose, approve], resources: [paper-desk-alpha, market-summaries], maximum_amount: "20000.00", expiry: "2026-12-31", redelegation: true, remaining_depth: 2}
      - {role: Portfolio Agent, capabilities: [research, propose], resources: [paper-desk-alpha, market-summaries], maximum_amount: "20000.00", expiry: "2026-12-31", redelegation: true, remaining_depth: 2}
      - {role: Research Agent, capabilities: [research], resources: [market-summaries], maximum_amount: "5000.00", expiry: "2026-06-30", redelegation: false, remaining_depth: 0}
      - {role: Requested Tool, capabilities: [research], resources: [market-summaries], maximum_amount: "500.00", expiry: "request-bound", redelegation: false, remaining_depth: 0}

  - id: confirmation_required
    title: Human confirmation required
    short_description: Valid authority, amount above autonomous threshold.
    category: valid_recoverable
    expected_decision: confirm
    expected_reason_code: confirmation_threshold
