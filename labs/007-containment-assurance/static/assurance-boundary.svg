<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="lab007-title lab007-desc">
  <title id="lab007-title">Containment assurance boundary</title>
  <desc id="lab007-desc">
    Flow from containment action through independent evidence collection and assurance checks
    to CONFIRMED, PARTIAL, UNVERIFIED, or FAILED. An assurance perimeter covers runtime,
    identity and sessions, credentials, tools, queues, delegates, network, and state and recovery.
    Containment is not the command we issue; it is a state we must verify.
  </desc>
  <rect width="960" height="580" fill="#f7f4ec"/>
  <text x="480" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1b2a4a">Containment assurance boundary</text>
  <text x="480" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5a6478">Containment is not the command we issue. It is a state we must verify.</text>

  <rect x="340" y="78" width="280" height="44" rx="6" fill="#1b2a4a"/>
  <text x="480" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#f7f4ec">Containment action</text>
  <text x="480" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9a7b2f">RESTRICT | ISOLATE | TERMINATE</text>

  <line x1="480" y1="148" x2="480" y2="172" stroke="#1b2a4a" stroke-width="2"/>
  <polygon points="480,178 474,168 486,168" fill="#1b2a4a"/>

  <rect x="300" y="180" width="360" height="48" rx="6" fill="#fffdf8" stroke="#1b2a4a" stroke-width="2"/>
  <text x="480" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1b2a4a" font-weight="600">Independent evidence collection</text>

  <line x1="480" y1="228" x2="480" y2="252" stroke="#1b2a4a" stroke-width="2"/>
  <polygon points="480,258 474,248 486,248" fill="#1b2a4a"/>

  <rect x="320" y="260" width="320" height="44" rx="6" fill="#1b2a4a"/>
  <text x="480" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#f7f4ec">Assurance checks</text>

  <line x1="480" y1="304" x2="480" y2="328" stroke="#1b2a4a" stroke-width="2"/>
  <polygon points="480,334 474,324 486,324" fill="#1b2a4a"/>

  <rect x="70" y="340" width="190" height="40" rx="6" fill="#e8f0e6" stroke="#2f6b3c" stroke-width="2"/>
  <text x="165" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1b2a4a" font-weight="600">CONFIRMED</text>
  <rect x="280" y="340" width="190" height="40" rx="6" fill="#fff8e6" stroke="#9a7b2f" stroke-width="2"/>
  <text x="375" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1b2a4a" font-weight="600">PARTIAL</text>
  <rect x="490" y="340" width="190" height="40" rx="6" fill="#fff8e6" stroke="#b08d2a" stroke-width="2"/>
  <text x="585" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1b2a4a" font-weight="600">UNVERIFIED</text>
  <rect x="700" y="340" width="190" height="40" rx="6" fill="#f8e8e8" stroke="#8b2e2e" stroke-width="2"/>
  <text x="795" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#1b2a4a" font-weight="600">FAILED</text>

  <rect x="40" y="410" width="880" height="140" rx="8" fill="#fffdf8" stroke="#9a7b2f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="480" y="438" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#1b2a4a" font-weight="600">Assurance perimeter (independent of the agent)</text>

  <rect x="60" y="458" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="155" y="481" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Runtime</text>
  <rect x="270" y="458" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="365" y="481" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Identity and sessions</text>
  <rect x="480" y="458" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="575" y="481" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Credentials</text>
  <rect x="690" y="458" width="210" height="36" rx="4" fill="#1b2a4a"/>
  <text x="795" y="481" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Tools</text>

  <rect x="60" y="504" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="155" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Queues</text>
  <rect x="270" y="504" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="365" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Delegates</text>
  <rect x="480" y="504" width="190" height="36" rx="4" fill="#1b2a4a"/>
  <text x="575" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">Network</text>
  <rect x="690" y="504" width="210" height="36" rx="4" fill="#1b2a4a"/>
  <text x="795" y="527" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#f7f4ec">State and recovery</text>
</svg>
