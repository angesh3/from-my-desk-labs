<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent escalation boundary flow</title>
  <desc id="desc">Context and authority feed uncertainty and consequence evaluation, which selects an execution posture of proceed, clarify, escalate, or stop, then explains and records the decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0b1f33"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#f7f4ec"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="20" fill="#0b1f33">The agent escalation boundary</text>
  <text x="32" y="64" font-family="Georgia, serif" font-size="13" fill="#5c5a54">Authorization asks what may be done. Judgment asks whether to continue alone.</text>

  <g font-family="Georgia, serif" font-size="13" fill="#0b1f33">
    <rect x="40" y="100" width="200" height="70" fill="#ffffff" stroke="#0b1f33"/>
    <text x="140" y="130" text-anchor="middle" font-weight="bold">Context and authority</text>
    <text x="140" y="150" text-anchor="middle" font-size="12" fill="#5c5a54">Identity / capability / authorization</text>

    <path d="M240 135 H300" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="300" y="100" width="220" height="70" fill="#ffffff" stroke="#0b1f33"/>
    <text x="410" y="130" text-anchor="middle" font-weight="bold">Uncertainty and consequence</text>
    <text x="410" y="150" text-anchor="middle" font-size="12" fill="#5c5a54">Evidence / impact / reversibility</text>

    <path d="M520 135 H580" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="580" y="100" width="160" height="70" fill="#ffffff" stroke="#0b1f33"/>
    <text x="660" y="130" text-anchor="middle" font-weight="bold">Execution posture</text>
    <text x="660" y="150" text-anchor="middle" font-size="12" fill="#5c5a54">Choose how to continue</text>

    <path d="M740 135 H800" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="800" y="100" width="120" height="70" fill="#ffffff" stroke="#0b1f33"/>
    <text x="860" y="130" text-anchor="middle" font-weight="bold">Explain</text>
    <text x="860" y="150" text-anchor="middle" font-size="12" fill="#5c5a54">Record decision</text>

    <rect x="80" y="230" width="180" height="56" fill="#e8f5ee" stroke="#1f7a4d"/>
    <text x="170" y="263" text-anchor="middle" font-weight="bold" fill="#1f7a4d">PROCEED</text>

    <rect x="290" y="230" width="180" height="56" fill="#e8eef8" stroke="#2b5a9e"/>
    <text x="380" y="263" text-anchor="middle" font-weight="bold" fill="#2b5a9e">CLARIFY</text>

    <rect x="500" y="230" width="180" height="56" fill="#fff4e0" stroke="#c9a227"/>
    <text x="590" y="263" text-anchor="middle" font-weight="bold" fill="#8a6a10">ESCALATE</text>

    <rect x="710" y="230" width="180" height="56" fill="#f8e8e8" stroke="#a31f1f"/>
    <text x="800" y="263" text-anchor="middle" font-weight="bold" fill="#a31f1f">STOP</text>

    <text x="32" y="350" font-size="12" fill="#5c5a54">Inputs: goal clarity, evidence, impact, reversibility, policy coverage, time, human availability</text>
    <text x="32" y="375" font-size="12" fill="#5c5a54">Color supports the label; outcomes are always named in text.</text>
  </g>
</svg>
