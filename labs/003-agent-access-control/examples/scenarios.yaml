scenarios:
  - id: managed_public_data_read
    title: Managed agent reads public data
    short_description: Registered research agent reads public Cedar Quill Markets data within delegation.
    category: valid_recoverable
    expected_decision: allow
    expected_reason_code: within_current_authority
    request:
      request_id: req-cq-001
      principal_id: cq-principal-001
      agent_id: cq-research-agent-001
      requested_action: read
      requested_tool: market_feed_reader
      requested_resource: cedar-quill-public-research
      data_classification: public
      requested_amount: "500.00"
      stated_purpose: market_research
      request_time: "2026-03-15T14:00:00Z"
      delegation_id: del-cq-portfolio-research
      context: normal
      assurance_level: standard
      restricted_operation: false

