<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Verifiable action receipt chain</title>
  <desc id="desc">Flow from request through authority, decision, execution, and outcome into a verifiable action receipt, with optional human approval into the decision boundary.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0b1f33"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#f7f4ec"/>
  <text x="32" y="40" font-family="Georgia, serif" font-size="20" fill="#0b1f33">Verifiable action receipt chain</text>
  <text x="32" y="64" font-family="Georgia, serif" font-size="13" fill="#5c5a54">A receipt connects intent, authority, judgment, execution, and outcome.</text>

  <g font-family="Georgia, serif" font-size="13" fill="#0b1f33">
    <rect x="40" y="120" width="120" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="100" y="153" text-anchor="middle" font-weight="bold">Request</text>

    <path d="M160 148 H200" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="200" y="120" width="120" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="260" y="153" text-anchor="middle" font-weight="bold">Authority</text>

    <path d="M320 148 H360" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="360" y="120" width="120" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="420" y="153" text-anchor="middle" font-weight="bold">Decision</text>

    <path d="M480 148 H520" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="520" y="120" width="120" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="580" y="153" text-anchor="middle" font-weight="bold">Execution</text>

    <path d="M640 148 H680" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="680" y="120" width="110" height="56" fill="#ffffff" stroke="#0b1f33"/>
    <text x="735" y="153" text-anchor="middle" font-weight="bold">Outcome</text>

    <path d="M790 148 H830" stroke="#0b1f33" fill="none" marker-end="url(#arrow)"/>

    <rect x="830" y="120" width="100" height="56" fill="#e8f5ee" stroke="#1f7a4d"/>
    <text x="880" y="153" text-anchor="middle" font-weight="bold" fill="#1f7a4d">Receipt</text>

    <rect x="360" y="230" width="200" height="56" fill="#fff4e0" stroke="#c9a227"/>
    <text x="460" y="255" text-anchor="middle" font-weight="bold" fill="#8a6a10">Human approval</text>
    <text x="460" y="273" text-anchor="middle" font-size="12" fill="#5c5a54">Conditional input</text>
    <path d="M460 230 V176" stroke="#c9a227" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <text x="32" y="340" font-size="12" fill="#5c5a54">Authorization (ALLOW / CONFIRM / STEP_UP / DENY) and execution judgment (PROCEED / CLARIFY / ESCALATE / STOP) stay distinct.</text>
    <text x="32" y="365" font-size="12" fill="#5c5a54">Integrity statuses: VERIFIED, TAMPERED, CHAIN BROKEN. A hash detects change relative to a trusted reference; it does not prove identity alone.</text>
    <text x="32" y="390" font-size="12" fill="#5c5a54">Educational simulation only. No real account, identity, or infrastructure action is performed.</text>
  </g>
</svg>
