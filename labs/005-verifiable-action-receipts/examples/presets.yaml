presets:
  - id: authorized_and_recorded
    title: Authorized and recorded
    short_description: Clear session revoke with explicit capability and high-confidence evidence.
    expected_execution_judgment: proceed
    expected_integrity: verified
    category: verified
    request:
      request_id: req-cq-005-001
      correlation_id: corr-cq-session-revoke-01
      agent_identity: cq-soc-response-agent-01
      principal_identity: cq-soc-lead-morgan
      target_resource: alex.rivera@cedarquill.example
      requested_action: revoke_suspicious_session
      delegated_capability: revoke_sessions
      authority_source: cq-delegation-register
      policy_id: cq-soc-response-policy
      policy_version: lab005-receipt-v1
      authorization_outcome: allow
      execution_judgment: proceed
      evidence_references:
        - evid-login-geo-mismatch
        - evid-device-fingerprint-new
        - evid-threat-intel-ip
      evidence_summary: High-confidence malicious session indicators aligned across login, device, and threat intel.
      human_involvement: none
      simulated_tool: cq-session-control
      simulated_tool_action: revoke_session
      observed_outcome: Suspicious session token marked revoked in the fictional session store.
      reason_codes:
        - auth.allow
        - judgment.proceed
        - tool.session_revoke_simulated
      explanation: Authorization allowed the revoke and execution judgment chose PROCEED for a reversible, explicitly covered action.
      created_at: "2026-09-16T15:00:00Z"
      receipt_id: rcpt-authorized-001

