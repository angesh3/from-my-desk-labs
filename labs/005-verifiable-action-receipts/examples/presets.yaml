      authorization_outcome: allow
      execution_judgment: clarify
      evidence_references:
        - evid-operator-chat-turn-1
      evidence_summary: Operator asked to “secure the account” without naming the control.
      human_involvement: clarification
      original_request: Secure the account.
      clarification_note: Which control should be used—monitor, challenge, revoke, or suspend?
      observed_outcome: Clarification requested; no tool action performed.
      reason_codes:
        - judgment.clarify
