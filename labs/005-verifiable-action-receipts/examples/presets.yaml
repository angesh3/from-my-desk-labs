      human_involvement: clarification
      original_request: Secure the account.
      clarification_note: Operator selected session revocation.
      simulated_tool: cq-session-control
      simulated_tool_action: revoke_session
      observed_outcome: Suspicious session revoked after clarification (fictional).
      reason_codes:
