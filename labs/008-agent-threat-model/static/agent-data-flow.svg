<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Agent data-flow diagram with trust boundaries</title>
  <desc id="desc">Numbered data flows move from a principal through identity and authority controls into an agent runtime, approved model, retrieval and memory services, tools, delegated workers, queues, network resources, and protected systems. Side flows cover public-model calls, residual bypass paths, credentials, and independent telemetry into an external evidence and containment plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10213d"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2d7a54"/></marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
    <style>
      .bg{fill:#f7f2e8}.zone{fill:#fff;stroke:#cfc5b4;stroke-width:2}.agentZone{fill:#f8fbff;stroke:#10213d;stroke-width:2;stroke-dasharray:10 8}.externalZone{fill:#fff9e9;stroke:#b98b3e;stroke-width:2;stroke-dasharray:10 8}.controlZone{fill:#edf6f0;stroke:#2d7a54;stroke-width:2;stroke-dasharray:10 8}.publicZone{fill:#fff5f5;stroke:#c62828;stroke-width:2;stroke-dasharray:8 6}.node{fill:#fff;stroke:#10213d;stroke-width:2}.control{fill:#edf6f0;stroke:#2d7a54;stroke-width:2}.external{fill:#fff7df;stroke:#b98b3e;stroke-width:2}.public{fill:#ffecec;stroke:#c62828;stroke-width:2}.title{font:700 28px Georgia,serif;fill:#10213d}.label{font:700 17px Georgia,serif;fill:#10213d}.small{font:13px Arial,sans-serif;fill:#5e5a52}.boundary{font:700 12px Arial,sans-serif;fill:#6f695f;letter-spacing:1px}.flow{fill:none;stroke:#10213d;stroke-width:2;marker-end:url(#arrow)}.telemetry{fill:none;stroke:#2d7a54;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#green-arrow)}.risk{fill:none;stroke:#c62828;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#red-arrow)}.bypass{fill:none;stroke:#b98b3e;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow)}.num{fill:#10213d}.numText{font:700 13px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="940"/>
  <text class="title" x="55" y="48">Example data-flow diagram</text>
  <text class="small" x="55" y="74">Follow data, authority, evidence, public-model egress, and residual bypass paths across explicit trust boundaries.</text>

  <rect class="externalZone" x="35" y="100" width="230" height="520" rx="18"/>
  <text class="boundary" x="55" y="128">EXTERNAL / PRINCIPAL ZONE</text>
  <rect class="external" x="55" y="160" width="190" height="78" rx="12"/>
  <text class="label" x="150" y="192" text-anchor="middle">Principal</text>
  <text class="small" x="150" y="216" text-anchor="middle">Intent + request</text>
  <rect class="external" x="55" y="300" width="190" height="86" rx="12"/>
  <text class="label" x="150" y="332" text-anchor="middle">External Content</text>
  <text class="small" x="150" y="356" text-anchor="middle">Documents · web · events</text>
  <rect class="public" x="55" y="450" width="190" height="86" rx="12"/>
  <text class="label" x="150" y="482" text-anchor="middle">Public-model calls</text>
  <text class="small" x="150" y="506" text-anchor="middle">External / public boundary</text>

  <rect class="agentZone" x="290" y="100" width="560" height="520" rx="18"/>
  <text class="boundary" x="310" y="128">AGENT RUNTIME TRUST BOUNDARY</text>
  <rect class="control" x="325" y="155" width="200" height="86" rx="12"/>
  <text class="label" x="425" y="188" text-anchor="middle">Identity / Authority</text>
  <text class="small" x="425" y="212" text-anchor="middle">Verify · scope · approve</text>
  <rect class="node" x="580" y="155" width="230" height="86" rx="12"/>
  <text class="label" x="695" y="188" text-anchor="middle">Agent Runtime</text>
  <text class="small" x="695" y="212" text-anchor="middle">Plan · decide · coordinate</text>

  <rect class="node" x="325" y="300" width="190" height="86" rx="12"/>
  <text class="label" x="420" y="332" text-anchor="middle">Approved Model</text>
  <text class="small" x="420" y="356" text-anchor="middle">Prompt + inference</text>
  <rect class="node" x="560" y="300" width="240" height="86" rx="12"/>
  <text class="label" x="680" y="332" text-anchor="middle">Memory / Retrieval</text>
  <text class="small" x="680" y="356" text-anchor="middle">Context · RAG · learning</text>

  <rect class="node" x="325" y="450" width="190" height="86" rx="12"/>
  <text class="label" x="420" y="482" text-anchor="middle">Tool Gateway</text>
  <text class="small" x="420" y="506" text-anchor="middle">Policy-bound calls</text>
  <rect class="node" x="560" y="450" width="240" height="86" rx="12"/>
  <text class="label" x="680" y="482" text-anchor="middle">Delegated Worker</text>
  <text class="small" x="680" y="506" text-anchor="middle">Narrowed handoff</text>

  <rect class="externalZone" x="880" y="100" width="285" height="520" rx="18"/>
  <text class="boundary" x="900" y="128">PROTECTED / INFRA ZONE</text>
  <rect class="external" x="910" y="160" width="220" height="78" rx="12"/>
  <text class="label" x="1020" y="192" text-anchor="middle">Tools / APIs</text>
  <text class="small" x="1020" y="216" text-anchor="middle">Actions + credentials</text>
  <rect class="external" x="910" y="280" width="220" height="78" rx="12"/>
  <text class="label" x="1020" y="312" text-anchor="middle">Protected Data</text>
  <text class="small" x="1020" y="336" text-anchor="middle">Records · secrets · results</text>
  <rect class="node" x="910" y="400" width="220" height="78" rx="12"/>
  <text class="label" x="1020" y="432" text-anchor="middle">Queues / scheduled</text>
  <text class="small" x="1020" y="456" text-anchor="middle">Residual / bypass path</text>
  <rect class="node" x="910" y="510" width="220" height="78" rx="12"/>
  <text class="label" x="1020" y="542" text-anchor="middle">Network / resources</text>
  <text class="small" x="1020" y="566" text-anchor="middle">Reach · cost · capacity</text>

  <rect class="controlZone" x="290" y="660" width="875" height="78" rx="18"/>
  <text class="label" x="727" y="692" text-anchor="middle">Independent Evidence &amp; External Containment / Control Plane</text>
  <text class="small" x="727" y="716" text-anchor="middle">Telemetry · receipts · revoke · isolate · terminate · recover — outside the agent runtime</text>

  <path class="flow" d="M245 200H325"/>
  <circle class="num" cx="285" cy="184" r="14"/><text class="numText" x="285" y="184">1</text>
  <path class="flow" d="M525 198H580"/>
  <circle class="num" cx="552" cy="182" r="14"/><text class="numText" x="552" y="182">2</text>
  <path class="flow" d="M695 241V300"/>
  <circle class="num" cx="714" cy="270" r="14"/><text class="numText" x="714" y="270">3</text>
  <path class="flow" d="M560 343H515"/>
  <circle class="num" cx="538" cy="327" r="14"/><text class="numText" x="538" y="327">4</text>
  <path class="flow" d="M245 343H560"/>
  <circle class="num" cx="285" cy="327" r="14"/><text class="numText" x="285" y="327">5</text>
  <path class="flow" d="M560 493H515"/>
  <circle class="num" cx="538" cy="477" r="14"/><text class="numText" x="538" y="477">6</text>
  <path class="flow" d="M515 493H880V200H910"/>
  <circle class="num" cx="850" cy="477" r="14"/><text class="numText" x="850" y="477">7</text>
  <path class="flow" d="M1020 238V280"/>
  <circle class="num" cx="1039" cy="259" r="14"/><text class="numText" x="1039" y="259">8</text>
  <path class="flow" d="M910 319H850V580H800"/>
  <circle class="num" cx="880" cy="303" r="14"/><text class="numText" x="880" y="303">9</text>

  <path class="risk" d="M420 300H245V450"/>
  <text class="small" x="250" y="430">A public egress</text>
  <path class="bypass" d="M800 493H910V439"/>
  <text class="small" x="820" y="470">residual queue</text>
  <path class="risk" d="M515 536H910V549"/>
  <text class="small" x="700" y="560">network / resource reach</text>

  <path class="telemetry" d="M425 241V660"/>
  <path class="telemetry" d="M695 536V660"/>
  <path class="telemetry" d="M1020 588V660"/>

  <text class="small" x="55" y="780">1 Request + principal identity  ·  2 scoped authority  ·  3 context / plan  ·  4 approved-model inference  ·  5 retrieved / memory context</text>
  <text class="small" x="55" y="804">6 worker handoff  ·  7 policy-bound tool call  ·  8 protected data access  ·  9 result  ·  red dashed: public-model / network risk  ·  gold dashed: residual bypass</text>
  <text class="small" x="55" y="828">Green dashed: independent evidence into the external containment / control plane. Queued work and child agents can continue after revocation if not re-checked.</text>
  <text class="small" x="55" y="868">Cross-cutting dimensions: behavior and usage drift · learning and memory drift · external model exposure · network and resource impact</text>
  <text class="small" x="55" y="900">Lab 008 · Cedar Quill Markets fictional data flow · execution: not_performed</text>
</svg>
